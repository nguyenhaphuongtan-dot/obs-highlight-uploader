<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>OBS Highlight Uploader</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
<main class="container">
  <h1>OBS Highlight Uploader</h1>

  <details id="settings">
    <summary>Cài đặt Cloud</summary>
    <label for="worker-url">Địa chỉ Worker</label>
    <input id="worker-url" placeholder="https://backend.hl-clips.workers.dev" />
    <label for="api-token">Mã bí mật (API_TOKEN)</label>
    <input id="api-token" type="password" />
    <button id="save-settings">Lưu cài đặt</button>
    <p id="settings-status"></p>
  </details>

  <button id="pick-btn">Chọn file MKV</button>
  <p id="file-path">Chưa chọn file</p>
  <pre id="info"></pre>

  <button id="convert-btn" disabled>Chuyển sang MP4</button>
  <div id="progress-wrap" hidden>
    <div id="progress-bar"></div>
  </div>
  <p id="status"></p>
  <button id="open-btn" hidden>Mở thư mục</button>

  <div id="upload-box" hidden>
    <label for="limit">Giới hạn tốc độ upload</label>
    <select id="limit">
      <option value="0">Không giới hạn</option>
      <option value="4096">4 MB/s</option>
      <option value="2048" selected>2 MB/s</option>
      <option value="1024">1 MB/s</option>
      <option value="512">512 KB/s</option>
    </select>
    <button id="upload-btn">Upload lên Cloud</button>
    <button id="cancel-btn" hidden>Hủy upload</button>
    <div id="up-progress-wrap" hidden>
      <div id="up-progress-bar"></div>
    </div>
    <p id="up-status"></p>
    <input id="link" readonly hidden />
    <button id="copy-btn" hidden>Sao chép link</button>
  </div>
</main>
  </body>
</html>
